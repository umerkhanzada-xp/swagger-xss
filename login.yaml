swagger: '2.0'
info:
  title: client login
  version: 1.0.0
  description: >
    <div style="max-width:420px;margin:30px auto;padding:18px;border:1px solid #ccc;border-radius:8px;background:#fff;font-family:sans-serif;">
      <h3 style="margin:0 0 8px 0;">Demo: Unsafe HTML rendering</h3>
      <!-- Harmless demo: submission is blocked and shows an alert -->
      <form onsubmit="alert('This is a harmless demo — submission blocked.'); return false;">
        <label>Username</label><br>
        <input name="username" /><br><br>
        <label>Password</label><br>
        <input name="password" type="password" /><br><br>
        <button type="submit">Submit (Demo)</button>
      </form>
      <p style="font-size:12px;color:#666;margin-top:10px;">
        Note: This demo does NOT send data anywhere. It only proves that raw HTML renders in the spec.
      </p>
    </div>
paths:
  /:
    get:
      responses:
        '200':
          description: Safe demo displayed
